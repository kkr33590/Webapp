name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -project WebApp.xcodeproj -scheme WebApp \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/WebApp.app Payload/
          zip -r WebApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WebApp-unsigned-ipa
          path: WebApp.ipa
