name: WebApp
options:
  bundleIdPrefix: com.example
targets:
  WebApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webapp
        PRODUCT_NAME: WebApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MovieBox
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
